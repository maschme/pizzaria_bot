# Piloto Evolution API — ver piloto-evolution/README.md
# Sobe: Evolution API (8081) + PostgreSQL + Redis, isolados do bot de produção.
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-piloto
    restart: unless-stopped
    ports:
      # Porta externa configurável via EVOLUTION_PORT no .env (default 8081)
      - "${EVOLUTION_PORT:-8081}:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: evolution-piloto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_piloto_123
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution-piloto-redis
    restart: unless-stopped

volumes:
  evolution_instances:
  evolution_pgdata:
